<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#4f46e5" />
  <meta name="description" content="Snap a receipt and the expense records itself. A fast, offline expense tracker for personal, business, property, travel or farm spending." />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Snap" />
  <title>Snap · Expense Tracker</title>
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" href="./icons/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>

  <!-- Splash while IndexedDB opens; removed by app.js -->
  <div id="boot" class="boot">
    <div class="boot-mark">📸</div>
    <div class="boot-text">Snap</div>
  </div>

  <header class="app-bar" hidden>
    <button class="ws-switch" id="ws-switch" type="button" aria-label="Switch workspace">
      <span class="ws-icon" id="ws-icon">🏠</span>
      <span class="ws-meta">
        <span class="ws-name" id="ws-name">Personal</span>
        <span class="ws-sub" id="ws-sub">This month</span>
      </span>
      <span class="ws-chev" aria-hidden="true">▾</span>
    </button>
    <button class="icon-btn" id="btn-settings" type="button" aria-label="Settings">⚙️</button>
  </header>

  <main id="view" class="view" hidden></main>

  <nav class="tabbar" id="tabbar" hidden>
    <button class="tab" data-tab="home" aria-label="Home">
      <span class="tab-icon">🏠</span><span class="tab-label">Home</span>
    </button>
    <button class="tab" data-tab="records" aria-label="Records">
      <span class="tab-icon">🧾</span><span class="tab-label">Records</span>
    </button>
    <div class="tab-fab-slot">
      <button class="fab" id="fab-scan" type="button" aria-label="Scan a receipt">
        <svg viewBox="0 0 24 24" width="26" height="26" aria-hidden="true">
          <path fill="currentColor" d="M9 3 7.2 5H4a2 2 0 0 0-2 2v11a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-3.2L15 3H9Zm3 5.5A4.5 4.5 0 1 1 7.5 13 4.5 4.5 0 0 1 12 8.5Zm0 2A2.5 2.5 0 1 0 14.5 13 2.5 2.5 0 0 0 12 10.5Z"/>
        </svg>
      </button>
    </div>
    <button class="tab" data-tab="insights" aria-label="Insights">
      <span class="tab-icon">📈</span><span class="tab-label">Insights</span>
    </button>
    <button class="tab" data-tab="more" aria-label="More">
      <span class="tab-icon">⋯</span><span class="tab-label">More</span>
    </button>
  </nav>

  <!-- One shared file input drives camera, gallery and file picking -->
  <input type="file" id="file-input" accept="image/*,application/pdf,.csv,text/csv" hidden />
  <input type="file" id="camera-input" accept="image/*" capture="environment" hidden />
  <input type="file" id="restore-input" accept="application/json,.json" hidden />

  <div id="sheet-host"></div>
  <div id="toast-host" class="toast-host"></div>

  <script type="module" src="./js/app.js"></script>
</body>
</html>
